# ---------------------------------------------------------------------------
# 工程全局配置
# ---------------------------------------------------------------------------

mod_version=0.51.0

# ---------------------------------------------------------------------------
# ⚠ 中文路径陷阱（2026-10-26 实测，本工程第一次构建就踩到了，两次）
#
# Gradle 用 java.util.Properties 读 gradle.properties，那是 Latin-1 语义 + 会处理
# \uXXXX 转义。本工程路径含中文（工程-刷铁机设计轮椅），一旦在 org.gradle.jvmargs
# 里带上这个路径，就有一个几乎无解的转义两难：
#
#   写 D:/工程-刷铁机设计轮椅/...   → Properties 按 Latin-1 读，路径烂成乱码
#   写 D:/\u5DE5\u7A0B-...          → 单反斜杠会被 Properties 吃掉转义，实测报
#                                      java.io.IOException: java.io.tmpdir is set to
#                                      a directory that doesn't exist
#   写 D:/\\u5DE5\\u7A0B-...        → 双反斜杠变成「字面 \ + u5DE5」，目录名就叫
#                                      \u5DE5\u7A0B-... ，同样不存在，且报错信息
#                                      看起来像路径拼错，极难联想到转义层数
#
# 结论：**这个工程的 jvmargs 一律不带任何中文路径**，tmpdir 交给 JVM 默认值。
# ---------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# 1.21.1 的构建坐标（2026-10-26 从官方模板核对）
#
# 注意 loom_version：官方模板写的是 1.19-SNAPSHOT，那是快照。
# 这里用 1.19.3 的正式版，保证可重现（快照会随时间变化）。
#
# 1.21.1 属于 1.21.11 之前的混淆版本，所以 build.gradle 里必须用
# net.fabricmc.fabric-loom-remap 而不是 26.x 用的 fabric-loom，
# 并且 mappings 那一行不能省。
# ---------------------------------------------------------------------------

minecraft_version=1.21.1
loader_version=0.20.1
fabric_api_version=0.116.17+1.21.1
loom_version=1.18.4
# ---------------------------------------------------------------------------
# NeoForge 1.21.1 的构建坐标
#
# 版本取自用户测试客户端已装的：libraries/net/neoforged/neoforge/21.1.256
# 用已装版本可以避免玩家升级加载器。
# ---------------------------------------------------------------------------

neoforge_version=21.1.256
neoforge_mc_version=1.21.1
# ---------------------------------------------------------------------------
# 26.3 的构建坐标
#
# 值来自《我的世界开发skill》的 version-matrix.md，该表标注 26.3 行
# 为 fully verified（toolchain same as 26.2；与本地安装的 loader 0.19.5 一致）。
#
# ⚠ 26.3 是非混淆版本，build.gradle 里**不能写 mappings**，
#   插件 id 也要用 net.fabricmc.fabric-loom（不是 -remap）。
# ---------------------------------------------------------------------------

mc26_version=26.3
mc26_loader_version=0.19.5
mc26_fabric_api_version=0.162.0+26.3
# ---------------------------------------------------------------------------
# 26.3 NeoForge 坐标
# 版本取自用户已装的：libraries/net/neoforged/neoforge/26.3.0.86
# ---------------------------------------------------------------------------

neoforge263_version=26.3.0.86
neoforge263_mc_version=26.3
