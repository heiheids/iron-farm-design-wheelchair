# NeoForge 26.3 Access Transformer
#
# 与 1.21.1 那份内容相同，只是类名跟着 26.3 的包结构调整：
#   Villager 从 npc 包移到 npc.villager 子包
#
# 刻意不开放 Screen.addRenderableWidget —— NeoForge 的 AT 处理会因为它
# 被泛型覆写而直接报错（ERROR Line: 320, ...CreateWorldScreen..<T>addRenderableWidget），
# 改用 Mixin 的 @Invoker 接口（见 ScreenInvoker）。

# Villager 的闲聊时间戳。
# 原版没有"正在闲聊"这个状态：gossip() 是一次性调用，
# 把 lastGossipTime 设为当时的时间。
public net.minecraft.world.entity.npc.villager.Villager lastGossipTime

# 交易界面的布局字段（加"村民状态"按钮用）。
# 这 4 个字段声明在父类 AbstractContainerScreen 上，不是 MerchantScreen。
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen leftPos
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen topPos
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageWidth
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageHeight
