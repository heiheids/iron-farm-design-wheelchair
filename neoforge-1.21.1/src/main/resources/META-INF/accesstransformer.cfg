# ---------------------------------------------------------------------------
# NeoForge Access Transformer
#
# 为什么这里要写一遍（Fabric 侧是 ironfarm.accesswidener）：
#   两个加载器的"开放访问权"机制完全不同：
#     Fabric   : AccessWidener v2, 格式 "accessible field <named> <name> <desc>"
#     NeoForge : AccessTransformer, 格式 "public <named> <name> <desc>"
#   名称写法也不同 —— AT 用点号分隔类名。
# ---------------------------------------------------------------------------

# Villager 的闲聊时间戳。
# 原版没有"正在闲聊"这个状态：gossip() 是一次性调用，把 lastGossipTime
# 设为当时的时间。不读它就只能猜一个窗口（第一版猜 200 tick，实际是 1200）。
public net.minecraft.world.entity.npc.Villager lastGossipTime

# MerchantScreen 的布局字段（用在 MerchantScreenMixin 里加"村民状态"按钮）。
# ⚠ 这 4 个字段声明在父类 AbstractContainerScreen 上，不是 MerchantScreen。
#   指错类不会报错，只会被当成"没这个字段"忽略，然后编译报 protected 访问控制。
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen leftPos
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen topPos
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageWidth
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageHeight


# ⚠ 这里刻意**不**开放 Screen.addRenderableWidget。
#   NeoForge 的 AT 处理会因为它被泛型覆写而报错：
#     "ERROR Line: 320, ...CreateWorldScreen..<T>addRenderableWidget(T)
#      .......Screen..<T>addRenderableWidget(T)"
#   而且 NeoForge 侧不需要它 —— mixin 里可以直接调 Screen 的 public API，
#   或者用 children() 之外的正常路径。见 MerchantScreenMixin 的说明。
